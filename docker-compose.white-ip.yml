# Запуск на белом IP без домена: всё приложение на одном порту 80.
#
#   docker compose -f docker-compose.white-ip.yml --env-file .env.white-ip up -d --build
#
# Отличия от docker-compose.prod.yml:
#   * в стек входит фронтенд — на белый IP заходят смотреть интерфейс,
#     а не дёргать API курлом;
#   * nginx собран вместе со статикой фронта и отдаёт всё с одного origin,
#     поэтому CORS не участвует вообще;
#   * профиль настроек hero_path.settings.white_ip: без HTTPS-редиректа и
#     без Secure-кук, иначе вход по http невозможен.
#
# Инструкция по портам, роутеру и брандмауэру: docs/WHITE_IP.md

x-django-env: &django-env
  env_file:
    - .env.white-ip
  environment:
    DJANGO_SETTINGS_MODULE: hero_path.settings.white_ip
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /var/lib/hero_path/media
    STATIC_ROOT: /var/lib/hero_path/static

x-app-base: &app-base
  build:
    context: .
  image: hero-path-backend:${IMAGE_TAG:-latest}
  <<: *django-env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - media:/var/lib/hero_path/media
    - static:/var/lib/hero_path/static

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB обязателен}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER обязателен}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    # Порт наружу не публикуется: на белом IP открытый 5432 находят
    # сканеры за часы.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    <<: *app-base
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn hero_path.wsgi:application
      -b 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3}
      --timeout ${GUNICORN_TIMEOUT:-60}
      --access-logfile -
      --error-logfile -"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery:
    <<: *app-base
    command: celery -A hero_path worker -l INFO --concurrency ${CELERY_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  celery-beat:
    <<: *app-base
    # Ровно одна реплика: вторая продублирует расписание и удвоит начисления.
    command: celery -A hero_path beat -l INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  telegram-bot:
    <<: *app-base
    # Единственный путь активации аккаунта: без бота никто не сможет войти.
    command: python manage.py run_telegram_bot
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  nginx:
    # Образ собирает фронт и кладёт статику внутрь nginx.
    build:
      context: ./hero-path-front
      dockerfile: Dockerfile.prod
    image: hero-path-front:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      # Слева — порт на вашем ПК, он же пробрасывается на роутере.
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/white-ip/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/white-ip/white_ip_proxy.inc:/etc/nginx/conf.d/white_ip_proxy.inc:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  redisdata:
  media:
  static:
