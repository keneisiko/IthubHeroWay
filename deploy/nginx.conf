# Reverse-proxy перед gunicorn. Статику и медиа отдаёт сам nginx, приложение
# видит только динамику. Метрики и админка наружу не выставляются.
#
# TLS включён: сертификат выпускается certbot'ом в deploy/certs/live/<домен>/,
# оттуда его и читает блок 443. Блок 80 только подтверждает домен для
# Let's Encrypt и отправляет всё остальное на https.
#
# Если сертификата ещё нет (новый сервер, другой домен), закомментируйте блок
# 443 и строку редиректа, а в .env.prod поставьте SECURE_SSL_REDIRECT=0 и
# COOKIE_SECURE=0 — иначе Django зациклит редирект, а браузер не сохранит
# CSRF-куку. После выпуска сертификата верните всё обратно.
#
# Общие location'ы подключаются только в блок 443. Раньше include стоял и в
# блоке 80, поэтому раскомментировать редирект было нельзя: `location /` из
# include и `location /` редиректа — это duplicate location, и nginx вообще
# не поднимался. Отсюда же следствие, с которым стек жил: редирект оставался
# выключенным, и одностраничное приложение отдавалось по незашифрованному
# http (на https уводил только Django, и только со своих путей).

# Версию nginx в заголовке Server не показываем.
server_tokens off;

upstream hero_path_web {
    server web:8000;
    keepalive 16;
}

# Внутренние сети, которым разрешён /metrics/. Prometheus обычно ходит
# из той же docker-сети или из служебной подсети.
geo $metrics_allowed {
    default        0;
    127.0.0.1/32   1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

server {
    listen 80;
    server_name _;

    # Подтверждение домена для Let's Encrypt должно работать до редиректа.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Проверка здоровья контейнера. Отдаёт её nginx сам: проверка ходит по
    # http на 127.0.0.1, и любой путь, уходящий в Django, отвечал бы ей
    # редиректом на https (SECURE_SSL_REDIRECT=1) — контейнер считался
    # больным при работающем сайте.
    #
    # Живость приложения проверяет сам контейнер web через /health/.
    # Гасить из-за неё прокси не нужно: статику он отдаёт и без бэкенда.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hero.ithub-nalchik.ru;

    # Пути именно такие: certbot складывает сертификат в live/<домен>/,
    # а каталог deploy/certs смонтирован в /etc/nginx/certs.
    ssl_certificate     /etc/nginx/certs/live/hero.ithub-nalchik.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/hero.ithub-nalchik.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Аватары студентов; выгрузки Hik сюда не попадают.
    client_max_body_size 10m;

    # HSTS — и для ответов Django: в API и админке нет своих add_header.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/conf.d/hero_path_locations.inc;
}
