# Reverse-proxy перед gunicorn. Статику и медиа отдаёт сам nginx, приложение
# видит только динамику. Метрики и админка наружу не выставляются.
#
# TLS: положите fullchain.pem/privkey.pem в deploy/certs и раскомментируйте
# server-блок с 443. Пока сертификата нет, стек работает по HTTP —
# в .env.prod при этом обязательно SECURE_SSL_REDIRECT=0, иначе Django
# зациклит редирект на https.

upstream hero_path_web {
    server web:8000;
    keepalive 16;
}

# Внутренние сети, которым разрешён /metrics/. Prometheus обычно ходит
# из той же docker-сети или из служебной подсети.
geo $metrics_allowed {
    default        0;
    127.0.0.1/32   1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

server {
    listen 80;
    server_name _;

    # Аватары студентов; выгрузки Hik сюда не попадают.
    client_max_body_size 10m;

    # Подтверждение домена для Let's Encrypt должно работать до редиректа на https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # location / { return 301 https://$host$request_uri; }   # включить вместе с TLS

    include /etc/nginx/conf.d/hero_path_locations.inc;
}

