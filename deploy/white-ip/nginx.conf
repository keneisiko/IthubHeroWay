# Один вход на порт 80: фронт, API, админка и файлы на одном origin.
#
# Зачем так: фронт обращается к API относительными путями (/api/v1/...).
# Пока всё на одном origin, не нужен ни CORS, ни CSRF_TRUSTED_ORIGINS для
# отдельного адреса фронта, ни пересборка образа при смене IP.

upstream hero_path_web {
    server web:8000;
    keepalive 16;
}

# Метрики наружу не отдаём: на белом IP их видит весь интернет.
geo $metrics_allowed {
    default        0;
    127.0.0.1/32   1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Аватары студентов.
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    # Статика Django: админка и Swagger. Статика фронта лежит в корне образа
    # и отдаётся блоком ниже.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
    }

    location ~ ^/metrics/?$ {
        if ($metrics_allowed = 0) {
            return 404;
        }
        proxy_pass http://hero_path_web;
        include /etc/nginx/conf.d/white_ip_proxy.inc;
    }

    # Всё, что обслуживает Django.
    location ~ ^/(api|admin|swagger|schema|health|ready)/ {
        proxy_pass http://hero_path_web;
        include /etc/nginx/conf.d/white_ip_proxy.inc;
    }

    # Одностраничное приложение: любой неизвестный путь отдаём index.html,
    # иначе перезагрузка страницы на /profile или /quests даст 404 —
    # маршрутизация живёт в браузере.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
