<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#9a33f4" />
    <meta name="description" content="IThub Путь Героя — gamification-платформа для учебного заведения" />
    <title>IThub — Путь героя</title>
    <style>
      /* Заставка до загрузки скриптов: знак IThub собирается из пикселей.
         Стили здесь, а не в CSS-бандле — он ещё не скачан. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10001;
        display: grid;
        place-items: center;
        background: #9a33f4;
        color: #f5f5f5;
      }
      .boot__inner { display: grid; justify-items: center; gap: 22px; }
      .boot__mark { width: 64px; height: 64px; overflow: visible; }
      .boot__frame {
        fill: none;
        stroke: #f5f5f5;
        stroke-width: 9;
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        animation: bootDraw 0.7s cubic-bezier(0.76, 0, 0.24, 1) 0.05s forwards;
      }
      .boot__core {
        fill: #f5f5f5;
        transform-origin: 32px 32px;
        transform: scale(0);
        animation: bootPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards;
      }
      .boot__steps { display: flex; gap: 6px; }
      .boot__steps i {
        width: 8px;
        height: 8px;
        background: #f5f5f5;
        opacity: 0.25;
        animation: bootStep 1.2s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .boot__steps i:nth-child(2) { animation-delay: 0.12s; }
      .boot__steps i:nth-child(3) { animation-delay: 0.24s; }
      .boot__steps i:nth-child(4) { animation-delay: 0.36s; }
      .boot__steps i:nth-child(5) { animation-delay: 0.48s; background: #ffd900; }
      #boot.boot--out {
        animation: bootLift 0.75s cubic-bezier(0.76, 0, 0.24, 1) forwards;
        pointer-events: none;
      }
      #boot.boot--out .boot__inner { animation: bootFade 0.35s ease-in forwards; }
      @keyframes bootDraw { to { stroke-dashoffset: 0; } }
      @keyframes bootPop { to { transform: scale(1); } }
      @keyframes bootStep {
        0%, 100% { opacity: 0.25; transform: translateY(0); }
        40% { opacity: 1; transform: translateY(-6px); }
      }
      @keyframes bootLift { to { clip-path: inset(0 0 100% 0); } }
      @keyframes bootFade { to { opacity: 0; transform: translateY(-16px); } }
      @media (prefers-reduced-motion: reduce) {
        .boot__frame { animation: none; stroke-dashoffset: 0; }
        .boot__core { animation: none; transform: none; }
        .boot__steps i { animation: none; opacity: 1; }
        #boot.boot--out { animation: bootFade 0.2s linear forwards; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot__inner">
        <svg class="boot__mark" viewBox="0 0 64 64">
          <rect class="boot__frame" x="4.5" y="4.5" width="55" height="55" rx="3" />
          <rect class="boot__core" x="22" y="22" width="20" height="20" />
        </svg>
        <div class="boot__steps"><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
