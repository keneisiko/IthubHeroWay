# Продакшен-стек: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Отличия от docker-compose.yml (dev):
#   * исходники не монтируются — код только из образа, как его собрал CI;
#   * порты db/redis наружу не публикуются, доступ только по внутренней сети;
#   * медиа и статика живут в томах, а не внутри контейнера;
#   * nginx терминирует HTTP(S), отдаёт статику и закрывает /metrics/ снаружи;
#   * Telegram-бот — обычный сервис с автоперезапуском, а не ручной запуск в шелле.
#
# Фронтенд сюда намеренно не входит: прод-сборка hero-path-front пока не готова.

x-django-env: &django-env
  env_file:
    - .env.prod
  environment:
    DJANGO_SETTINGS_MODULE: hero_path.settings.prod
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    MEDIA_ROOT: /var/lib/hero_path/media
    STATIC_ROOT: /var/lib/hero_path/static

x-app-base: &app-base
  build:
    context: .
  image: hero-path-backend:${IMAGE_TAG:-latest}
  <<: *django-env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - media:/var/lib/hero_path/media
    - static:/var/lib/hero_path/static

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB обязателен}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER обязателен}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Соединений нужно больше, чем воркеров: web + celery + beat + бот + миграции.
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-200}"]

  redis:
    image: redis:7
    restart: unless-stopped
    # appendonly: очередь Celery и кеш сессий переживают перезапуск хоста.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    <<: *app-base
    # Миграции и collectstatic — здесь, до старта gunicorn. Единственная реплика
    # web: при масштабировании миграции надо вынести в отдельный разовый job.
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn hero_path.wsgi:application
      -b 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-3}
      --timeout ${GUNICORN_TIMEOUT:-60}
      --access-logfile -
      --error-logfile -"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  celery:
    <<: *app-base
    command: celery -A hero_path worker -l INFO --concurrency ${CELERY_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A hero_path inspect ping -d celery@$$HOSTNAME"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  celery-beat:
    <<: *app-base
    # Ровно одна реплика: вторая продублирует все задачи расписания,
    # то есть удвоит начисления рейтинга.
    command: celery -A hero_path beat -l INFO
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  telegram-bot:
    <<: *app-base
    # Единственный путь активации аккаунта студентом: без работающего бота
    # никто не сможет войти на платформу.
    command: python manage.py run_telegram_bot
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # include-файлы conf.d не подхватывает сам (грузится только *.conf),
      # их подключают server-блоки.
      - ./deploy/hero_path_locations.inc:/etc/nginx/conf.d/hero_path_locations.inc:ro
      - ./deploy/hero_path_proxy.inc:/etc/nginx/conf.d/hero_path_proxy.inc:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
      # Сертификаты: certbot certonly --webroot -w ./deploy/certbot
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/certbot:/var/www/certbot
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
  redisdata:
  media:
  static:
