services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hero_path
      POSTGRES_USER: hero_path
      POSTGRES_PASSWORD: hero_path
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: hero_path.settings.base
      POSTGRES_HOST: db
      POSTGRES_DB: hero_path
      POSTGRES_USER: hero_path
      POSTGRES_PASSWORD: hero_path
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
      LXP_VERIFY_URL: ${LXP_VERIFY_URL}
      LXP_GRAPHQL_ENDPOINT: ${LXP_GRAPHQL_ENDPOINT}
      LXP_BOT_EMAIL: ${LXP_BOT_EMAIL}
      LXP_BOT_PASSWORD: ${LXP_BOT_PASSWORD}
      LXP_TOKEN_TTL_HOURS: ${LXP_TOKEN_TTL_HOURS}
      LXP_API_TOKEN: ${LXP_API_TOKEN}
      YOUGILE_API_URL: ${YOUGILE_API_URL}
      YOUGILE_API_TOKEN: ${YOUGILE_API_TOKEN}
      HIK_HOST: ${HIK_HOST}
      HIK_PORT: ${HIK_PORT:-443}
      HIK_APP_KEY: ${HIK_APP_KEY}
      HIK_APP_SECRET: ${HIK_APP_SECRET}
      HIK_DATA_MODE: ${HIK_DATA_MODE:-snapshot}
      HIK_USE_BROWSER_EXPORT: ${HIK_USE_BROWSER_EXPORT:-0}
      HIK_WEB_LOGIN_URL: ${HIK_WEB_LOGIN_URL:-}
      HIK_WEB_EMAIL: ${HIK_WEB_EMAIL:-}
      HIK_WEB_PASSWORD: ${HIK_WEB_PASSWORD:-}
      HIK_WEB_RECORDS_URL: ${HIK_WEB_RECORDS_URL:-}
      HIK_WEB_NAV_STEPS: ${HIK_WEB_NAV_STEPS:-}
      HIK_BROWSER_HEADLESS: ${HIK_BROWSER_HEADLESS:-1}
      HIK_BROWSER_TIMEOUT_MS: ${HIK_BROWSER_TIMEOUT_MS:-180000}
      HIK_BROWSER_DOWNLOAD_DIR: ${HIK_BROWSER_DOWNLOAD_DIR:-/tmp/hik_exports}
      HIK_FETCH_ENABLED: ${HIK_FETCH_ENABLED:-1}
    command: >
      sh -c "python manage.py collectstatic --noinput &&
      gunicorn hero_path.wsgi:application
      -b 0.0.0.0:8000
      --workers 3
      --timeout 60"

  celery:
    build: .
    depends_on:
      - db
      - redis
    environment:
      DJANGO_SETTINGS_MODULE: hero_path.settings.base
      POSTGRES_HOST: db
      POSTGRES_DB: hero_path
      POSTGRES_USER: hero_path
      POSTGRES_PASSWORD: hero_path
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
      LXP_VERIFY_URL: ${LXP_VERIFY_URL}
      LXP_GRAPHQL_ENDPOINT: ${LXP_GRAPHQL_ENDPOINT}
      LXP_BOT_EMAIL: ${LXP_BOT_EMAIL}
      LXP_BOT_PASSWORD: ${LXP_BOT_PASSWORD}
      LXP_TOKEN_TTL_HOURS: ${LXP_TOKEN_TTL_HOURS}
      LXP_API_TOKEN: ${LXP_API_TOKEN}
      YOUGILE_API_URL: ${YOUGILE_API_URL}
      YOUGILE_API_TOKEN: ${YOUGILE_API_TOKEN}
      HIK_HOST: ${HIK_HOST}
      HIK_PORT: ${HIK_PORT:-443}
      HIK_APP_KEY: ${HIK_APP_KEY}
      HIK_APP_SECRET: ${HIK_APP_SECRET}
      HIK_DATA_MODE: ${HIK_DATA_MODE:-snapshot}
      HIK_USE_BROWSER_EXPORT: ${HIK_USE_BROWSER_EXPORT:-0}
      HIK_WEB_LOGIN_URL: ${HIK_WEB_LOGIN_URL:-}
      HIK_WEB_EMAIL: ${HIK_WEB_EMAIL:-}
      HIK_WEB_PASSWORD: ${HIK_WEB_PASSWORD:-}
      HIK_WEB_RECORDS_URL: ${HIK_WEB_RECORDS_URL:-}
      HIK_WEB_NAV_STEPS: ${HIK_WEB_NAV_STEPS:-}
      HIK_BROWSER_HEADLESS: ${HIK_BROWSER_HEADLESS:-1}
      HIK_BROWSER_TIMEOUT_MS: ${HIK_BROWSER_TIMEOUT_MS:-180000}
      HIK_BROWSER_DOWNLOAD_DIR: ${HIK_BROWSER_DOWNLOAD_DIR:-/tmp/hik_exports}
      HIK_FETCH_ENABLED: ${HIK_FETCH_ENABLED:-1}
    volumes:
      - .:/app
    command: celery -A hero_path worker -l INFO

  celery-beat:
    build: .
    depends_on:
      - db
      - redis
    environment:
      DJANGO_SETTINGS_MODULE: hero_path.settings.base
      POSTGRES_HOST: db
      POSTGRES_DB: hero_path
      POSTGRES_USER: hero_path
      POSTGRES_PASSWORD: hero_path
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
      LXP_VERIFY_URL: ${LXP_VERIFY_URL}
      LXP_GRAPHQL_ENDPOINT: ${LXP_GRAPHQL_ENDPOINT}
      LXP_BOT_EMAIL: ${LXP_BOT_EMAIL}
      LXP_BOT_PASSWORD: ${LXP_BOT_PASSWORD}
      LXP_TOKEN_TTL_HOURS: ${LXP_TOKEN_TTL_HOURS}
      LXP_API_TOKEN: ${LXP_API_TOKEN}
      YOUGILE_API_URL: ${YOUGILE_API_URL}
      YOUGILE_API_TOKEN: ${YOUGILE_API_TOKEN}
      HIK_HOST: ${HIK_HOST}
      HIK_PORT: ${HIK_PORT:-443}
      HIK_APP_KEY: ${HIK_APP_KEY}
      HIK_APP_SECRET: ${HIK_APP_SECRET}
      HIK_DATA_MODE: ${HIK_DATA_MODE:-snapshot}
      HIK_USE_BROWSER_EXPORT: ${HIK_USE_BROWSER_EXPORT:-0}
      HIK_WEB_LOGIN_URL: ${HIK_WEB_LOGIN_URL:-}
      HIK_WEB_EMAIL: ${HIK_WEB_EMAIL:-}
      HIK_WEB_PASSWORD: ${HIK_WEB_PASSWORD:-}
      HIK_WEB_RECORDS_URL: ${HIK_WEB_RECORDS_URL:-}
      HIK_WEB_NAV_STEPS: ${HIK_WEB_NAV_STEPS:-}
      HIK_BROWSER_HEADLESS: ${HIK_BROWSER_HEADLESS:-1}
      HIK_BROWSER_TIMEOUT_MS: ${HIK_BROWSER_TIMEOUT_MS:-180000}
      HIK_BROWSER_DOWNLOAD_DIR: ${HIK_BROWSER_DOWNLOAD_DIR:-/tmp/hik_exports}
      HIK_FETCH_ENABLED: ${HIK_FETCH_ENABLED:-1}
    volumes:
      - .:/app
    command: celery -A hero_path beat -l INFO

  frontend:
    build:
      context: ./hero-path-front
      dockerfile: Dockerfile
    depends_on:
      - web
    ports:
      - "5173:5173"
    volumes:
      - ./hero-path-front:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_DEV_API_PROXY: http://web:8000

volumes:
  pgdata:
  frontend_node_modules:

