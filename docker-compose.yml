# Локальная разработка. Для продакшена: DJANGO_SETTINGS_MODULE=hero_path.settings.prod,
# секреты из хранилища, без volume с исходниками и без публикации портов db/redis.

x-django-env: &django-env
  DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-hero_path.settings.dev}
  SECRET_KEY: ${SECRET_KEY:-}
  DEBUG: ${DEBUG:-1}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,web}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
  POSTGRES_HOST: db
  POSTGRES_DB: hero_path
  POSTGRES_USER: hero_path
  POSTGRES_PASSWORD: hero_path
  REDIS_URL: redis://redis:6379/0
  ENVIRONMENT_NAME: ${ENVIRONMENT_NAME:-development}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
  TELEGRAM_ALERTS_ENABLED: ${TELEGRAM_ALERTS_ENABLED:-1}
  LXP_VERIFY_URL: ${LXP_VERIFY_URL:-}
  LXP_GRAPHQL_ENDPOINT: ${LXP_GRAPHQL_ENDPOINT:-}
  LXP_BOT_EMAIL: ${LXP_BOT_EMAIL:-}
  LXP_BOT_PASSWORD: ${LXP_BOT_PASSWORD:-}
  LXP_TOKEN_TTL_HOURS: ${LXP_TOKEN_TTL_HOURS:-23}
  LXP_API_TOKEN: ${LXP_API_TOKEN:-}
  LXP_USE_BROWSER_TOKEN_BOT: ${LXP_USE_BROWSER_TOKEN_BOT:-0}
  LXP_WEB_BASE_URL: ${LXP_WEB_BASE_URL:-https://newlxp.ru}
  LXP_WEB_LOGIN_URL: ${LXP_WEB_LOGIN_URL:-}
  LXP_BROWSER_HEADLESS: ${LXP_BROWSER_HEADLESS:-1}
  YOUGILE_API_URL: ${YOUGILE_API_URL:-}
  YOUGILE_API_TOKEN: ${YOUGILE_API_TOKEN:-}
  YOUGILE_WEBHOOK_SECRET: ${YOUGILE_WEBHOOK_SECRET:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  HIK_HOST: ${HIK_HOST:-}
  HIK_PORT: ${HIK_PORT:-443}
  HIK_APP_KEY: ${HIK_APP_KEY:-}
  HIK_APP_SECRET: ${HIK_APP_SECRET:-}
  HIK_DATA_MODE: ${HIK_DATA_MODE:-snapshot}
  HIK_USE_BROWSER_EXPORT: ${HIK_USE_BROWSER_EXPORT:-0}
  HIK_WEB_LOGIN_URL: ${HIK_WEB_LOGIN_URL:-}
  HIK_WEB_EMAIL: ${HIK_WEB_EMAIL:-}
  HIK_WEB_PASSWORD: ${HIK_WEB_PASSWORD:-}
  HIK_WEB_RECORDS_URL: ${HIK_WEB_RECORDS_URL:-}
  HIK_WEB_NAV_STEPS: ${HIK_WEB_NAV_STEPS:-}
  HIK_WEB_API_BASE: ${HIK_WEB_API_BASE:-}
  HIK_WEB_API_RECORDS_PATH: ${HIK_WEB_API_RECORDS_PATH:-}
  HIK_BROWSER_HEADLESS: ${HIK_BROWSER_HEADLESS:-1}
  HIK_BROWSER_TIMEOUT_MS: ${HIK_BROWSER_TIMEOUT_MS:-180000}
  HIK_BROWSER_DOWNLOAD_DIR: ${HIK_BROWSER_DOWNLOAD_DIR:-/tmp/hik_exports}
  HIK_FETCH_ENABLED: ${HIK_FETCH_ENABLED:-1}

x-app-base: &app-base
  build: .
  environment: *django-env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  volumes:
    - .:/app

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hero_path
      POSTGRES_USER: hero_path
      POSTGRES_PASSWORD: hero_path
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hero_path -d hero_path"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    <<: *app-base
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py collectstatic --noinput &&
      gunicorn hero_path.wsgi:application
      -b 0.0.0.0:8000
      --workers 3
      --timeout 60"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery:
    <<: *app-base
    command: celery -A hero_path worker -l INFO

  celery-beat:
    <<: *app-base
    command: celery -A hero_path beat -l INFO

  frontend:
    build:
      context: ./hero-path-front
      dockerfile: Dockerfile
    depends_on:
      - web
    ports:
      - "5173:5173"
    volumes:
      - ./hero-path-front:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_DEV_API_PROXY: http://web:8000

volumes:
  pgdata:
  frontend_node_modules:
