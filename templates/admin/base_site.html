{% extends "admin/base_site.html" %}

{% block branding %}
  <h1 id="site-name">
    IThub Hero Path Admin
    {% if request.user.is_authenticated %}
      <small style="font-size:12px;opacity:.8;">
        {{ request.user.get_full_name|default:request.user.username }} / {{ request.user.role|default:"superadmin" }}
      </small>
    {% endif %}
  </h1>
{% endblock %}
